app-id: com.snapetech.BookshelfNG
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: bookshelfng-wrapper
finish-args:
  - --share=network
  - --filesystem=xdg-config/bookshelfng:create
modules:
  - name: bookshelfng
    buildsystem: simple
    build-commands:
      - install -d /app/lib/bookshelfng /app/bin
      - cp -a src/. /app/lib/bookshelfng/
      - |
        cat > /app/bin/bookshelfng-wrapper <<'EOF'
        #!/usr/bin/env sh
        set -eu
        data_dir="${XDG_CONFIG_HOME:-$HOME/.config}/bookshelfng"
        mkdir -p "$data_dir"
        exec /app/lib/bookshelfng/Readarr -nobrowser "-data=$data_dir" "$@"
        EOF
      - chmod 0755 /app/bin/bookshelfng-wrapper
    sources:
      - type: dir
        path: src
