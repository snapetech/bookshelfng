replicaCount: 1

image:
  repository: ghcr.io/snapetech/bookshelfng
  tag: hardcover
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
containerSecurityContext: {}

service:
  type: ClusterIP
  port: 8787
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: bookshelfng.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  annotations: {}

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Keep credentials in Kubernetes Secrets and reference them with valueFrom.
extraEnv: []
