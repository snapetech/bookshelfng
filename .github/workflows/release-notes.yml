name: Release-note contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate release notes
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.2'
          package-manager-cache: false

      - name: Test release-note selection
        run: node --test scripts/release-notes.test.mjs

      - name: Validate release-note fragment or explicit opt-out
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BODY: ${{ github.event_name == 'pull_request' && github.event.pull_request.body || github.event.head_commit.message || '' }}
        shell: bash
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/pr-body.md"
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]] &&
             ! git diff --quiet --diff-filter=A "$BASE_SHA" "$HEAD_SHA" -- release-notes; then
            # A push can contain both user-facing commits and internal commits
            # marked release-note: none. Added fragments cover the whole push.
            : > "$body_file"
          else
            printf '%s' "$PR_BODY" > "$body_file"
          fi
          node scripts/check-release-notes.mjs \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --pr-body "$body_file" \
            --summary-file "$GITHUB_STEP_SUMMARY"
