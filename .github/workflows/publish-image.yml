name: Publish Images

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    tags:
      - "main-*"
    paths-ignore:
      - "README.md"
      - "docs/**"

env:
  DOTNET_VERSION: "6.0.427"
  READARR_VERSION: 0.4.20
  BUILD_SOURCEBRANCHNAME: ${{ github.head_ref || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require main release tag
        shell: bash
        run: |
          set -euo pipefail
          # Stable softcover/hardcover tags are reserved for main releases.
          # Develop pushes use explicit -develop tags so downstream SeerrNG
          # cannot accidentally consume unreleased changes.
          if [[ "${GITHUB_REF_TYPE}" == "branch" && "${GITHUB_REF_NAME}" == "develop" ]]; then
            echo "Publishing development images with explicit -develop tags."
            exit 0
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${GITHUB_REF_TYPE}" == "branch" && "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "Publishing stable images from main."
            exit 0
          fi
          if [[ "${GITHUB_REF_NAME}" != main-* ]]; then
            echo "Release image publishing requires a main-* tag, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          git fetch --force origin master main --tags || true
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            main_ref=origin/main
          else
            main_ref=origin/master
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "$main_ref"; then
            echo "Tag ${GITHUB_REF_NAME} must point at a commit on ${main_ref}." >&2
            exit 1
          fi

      - uses: jdx/mise-action@v3

      - name: Setup Environment Variables
        shell: bash
        run: |
          echo "SDK_PATH=${{ env.DOTNET_ROOT }}/sdk/${DOTNET_VERSION}" >> "$GITHUB_ENV"
          echo "DATE=$(date --rfc-3339=date)" >> "$GITHUB_ENV"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: _cache/nuget
          key: nuget-${{ runner.os }}-${{ hashFiles('src/Directory.Packages.props', 'src/**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: |
            _cache/node
            node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package.json', 'yarn.lock') }}
          restore-keys: |
            node-${{ runner.os }}-

      - name: Cache MSBuild outputs
        uses: actions/cache@v4
        with:
          path: _cache/msbuild
          key: msbuild-${{ runner.os }}-${{ hashFiles('src/**/*.cs', 'src/**/*.csproj', 'src/**/*.targets', 'src/**/*.props') }}
          restore-keys: |
            msbuild-${{ runner.os }}-${{ hashFiles('src/**/*.cs', 'src/**/*.csproj', 'src/**/*.targets', 'src/**/*.props') }}
            msbuild-${{ runner.os }}-

      - name: Cache Webpack
        uses: actions/cache@v4
        with:
          path: _cache/webpack
          key: webpack-${{ runner.os }}-${{ hashFiles('frontend/src/**/*', 'yarn.lock') }}
          restore-keys: |
            webpack-${{ runner.os }}-${{ hashFiles('frontend/src/**/*', 'yarn.lock') }}
            webpack-

      - name: Build
        shell: bash
        run: ./build.sh --backend --frontend
        env:
          READARRVERSION: ${{ env.READARR_VERSION }}.${{ github.run_number }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: softcover_meta
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/snapetech/bookshelfng
          tags: |
            type=raw,value=softcover,enable=${{ (github.ref_type == 'tag' && startsWith(github.ref_name, 'main-')) || github.ref == 'refs/heads/main' }}
            type=raw,value=softcover-v${{ env.READARR_VERSION }},enable=${{ (github.ref_type == 'tag' && startsWith(github.ref_name, 'main-')) || github.ref == 'refs/heads/main' }}
            type=raw,value=softcover-v${{ env.READARR_VERSION }}.${{ github.run_number }},enable=${{ (github.ref_type == 'tag' && startsWith(github.ref_name, 'main-')) || github.ref == 'refs/heads/main' }}
            type=raw,value=softcover-develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=softcover-develop-v${{ env.READARR_VERSION }},enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=softcover-develop-v${{ env.READARR_VERSION }}.${{ github.run_number }},enable=${{ github.ref == 'refs/heads/develop' }}

      - uses: docker/metadata-action@v5
        id: hardcover_meta
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/snapetech/bookshelfng
          tags: |
            type=raw,value=hardcover,enable=${{ (github.ref_type == 'tag' && startsWith(github.ref_name, 'main-')) || github.ref == 'refs/heads/main' }}
            type=raw,value=hardcover-v${{ env.READARR_VERSION }},enable=${{ (github.ref_type == 'tag' && startsWith(github.ref_name, 'main-')) || github.ref == 'refs/heads/main' }}
            type=raw,value=hardcover-v${{ env.READARR_VERSION }}.${{ github.run_number }},enable=${{ (github.ref_type == 'tag' && startsWith(github.ref_name, 'main-')) || github.ref == 'refs/heads/main' }}
            type=raw,value=hardcover-develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=hardcover-develop-v${{ env.READARR_VERSION }},enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=hardcover-develop-v${{ env.READARR_VERSION }}.${{ github.run_number }},enable=${{ github.ref == 'refs/heads/develop' }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: "linux/amd64,linux/arm64"
          push: true
          tags: ${{ steps.softcover_meta.outputs.tags }}
          labels: ${{ steps.softcover_meta.outputs.labels }}
          build-args: |
            GIT_BRANCH=${{ env.BUILD_SOURCEBRANCHNAME }}
            COMMIT_HASH=${{ github.sha }}
            BUILD_DATE=${{ env.DATE }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: "linux/amd64,linux/arm64"
          push: true
          tags: ${{ steps.hardcover_meta.outputs.tags }}
          labels: ${{ steps.hardcover_meta.outputs.labels }}
          build-args: |
            GIT_BRANCH=${{ env.BUILD_SOURCEBRANCHNAME }}
            COMMIT_HASH=${{ github.sha }}
            BUILD_DATE=${{ env.DATE }}
            METADATA_URL=https://hardcover.bookinfo.pro
            HARDCOVER=true
