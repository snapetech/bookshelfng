# git-cliff configuration for BookshelfNG's main-v* build tags.

[changelog]
header = "# BookshelfNG release notes\n\n"
body = """
{% if version %}\
    ## {{ version }}
{% else %}\
    ## Unreleased
{% endif %}\

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{% if commit.breaking %}[breaking] {% endif %}{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
    {% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
filter_commits = true
commit_parsers = [
  { message = '^chore\(release\):', skip = true },
  { message = '^chore\(deps.*\)', skip = true },
  { body = ".*security", group = "Security" },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^doc", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^test", group = "Testing" },
  { message = "^chore|^ci", group = "Maintenance" },
  { message = "^revert", group = "Reverts" },
]
tag_pattern = "main-v[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+"
skip_tags = "beta|alpha|rc"
topo_order = false
sort_commits = "newest"
